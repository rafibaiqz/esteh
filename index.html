<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#2f6b2a" />
    <title>ESTEH — Juragan Es Teh</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16' shape-rendering='crispEdges'%3E%3Crect x='4' y='3' width='8' height='1' fill='%231f3a17'/%3E%3Crect x='5' y='4' width='6' height='10' fill='%23e8f4f8'/%3E%3Crect x='6' y='6' width='4' height='7' fill='%23b5651d'/%3E%3Crect x='9' y='0' width='1' height='4' fill='%23e74c3c'/%3E%3C/svg%3E" />
  </head>
  <body>
    <div id="viewport">
      <div id="stage">
        <canvas id="world" aria-label="Dunia permainan"></canvas>
        <header id="hud" aria-label="Status usaha"></header>
        <div id="loc-hud"></div>
        <div id="ctl"></div>
        <nav id="toolbar" aria-label="Menu usaha"></nav>
        <section id="menu" class="menu" hidden></section>
        <div id="prep" hidden></div>
        <div id="cart-pop" hidden></div>
        <div id="pause" class="pause-back" hidden></div>
        <div id="fx" aria-hidden="true"></div>
        <div id="toasts" aria-live="polite"></div>
        <div id="title" class="title-screen"><canvas id="title-canvas" aria-hidden="true"></canvas><div id="title-ui"></div><div id="audio-hint" class="audio-hint" hidden>♪ Musik akan diputar setelah klik pertama</div></div>
        <div id="tooltip" role="tooltip"></div>
        <div id="modal-root"></div>
      </div>
    </div>
    <noscript>ESTEH membutuhkan JavaScript.</noscript>
    <script>
      // Startup guard: if the game script can't be loaded or crashes while starting,
      // show what happened instead of leaving a blank page. Removed from view once
      // the game is running (main.ts sets window.esteh).
      (function () {
        function show(detail) {
          if (window.esteh || document.getElementById('boot-error')) return;
          var box = document.createElement('div');
          box.id = 'boot-error';
          box.setAttribute('role', 'alert');
          box.style.cssText =
            'position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:24px;background:#f5e6c8;font:15px/1.5 "Trebuchet MS",Verdana,sans-serif;color:#38271d;z-index:9999';
          var card = document.createElement('div');
          card.style.cssText = 'max-width:520px;padding:20px 24px;background:#fff8e9;border:2px solid #c98a32;border-radius:12px';
          card.innerHTML = '<b style="color:#6b4226;font-size:18px">ESTEH gagal dimuat</b><p style="margin:8px 0">Coba muat ulang halaman. Kalau masih terjadi, kirimkan pesan di bawah ini ke pembuat game.</p>';
          var pre = document.createElement('pre');
          pre.style.cssText = 'white-space:pre-wrap;font-size:12px;background:#fbf0da;padding:8px;border-radius:6px;margin:0';
          pre.textContent = String(detail);
          card.appendChild(pre);
          box.appendChild(card);
          document.body.appendChild(box);
        }
        window.__estehBootError = show;
        window.addEventListener('error', function (e) {
          var t = e.target;
          if (t && t.tagName === 'SCRIPT') show('Skrip permainan tidak bisa dimuat: ' + (t.src || '(tanpa alamat)'));
        }, true);
        window.addEventListener('load', function () {
          setTimeout(function () {
            if (!window.esteh) show('Skrip permainan tidak berjalan (tidak ada pesan galat dari browser).');
          }, 5000);
        });
      })();
    </script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
